<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prakash Thummisetti</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --border: #2a2a38;
      --text: #f0ede8;
      --text-muted: #8a8799;
      --accent: #7c6af7;
      --accent-glow: rgba(124, 106, 247, 0.25);
      --green: #34d399;
      --amber: #fbbf24;
      --pink: #f472b6;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    html { font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 4rem;
      overflow-x: hidden;
    }

    /* stars */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        radial-gradient(1px 1px at 15% 20%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 8%,  #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 35%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 15%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 70%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 80%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 55%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 50% 50%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 90%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 45%, rgba(255,255,255,0.4) 0%, transparent 100%);
      opacity: 0.5;
      pointer-events: none;
    }

    .card {
      position: relative; z-index: 1;
      max-width: 640px; width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem 2.5rem;
      text-align: center;
      box-shadow: 0 0 60px var(--accent-glow);
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      width: 160px; height: 160px;
      margin: 0 auto 2rem;
    }
    .avatar-wrap svg.avatar { width: 160px; height: 160px; }

    /* floating icons */
    .float-icon {
      position: absolute;
      width: 36px; height: 36px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      animation: bob 3s ease-in-out infinite;
    }
    .float-icon:nth-child(2) { top: -6px;  left: -10px; animation-delay: 0s; }
    .float-icon:nth-child(3) { top: -6px;  right: -10px; animation-delay: 0.6s; }
    .float-icon:nth-child(4) { bottom: 10px; left: -18px; animation-delay: 1.2s; }
    .float-icon:nth-child(5) { bottom: 10px; right: -18px; animation-delay: 1.8s; }
    @keyframes bob {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-6px); }
    }

    /* ── Text ── */
    .greeting {
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 0.6rem;
    }
    h1 {
      font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em;
      margin-bottom: 0.5rem; line-height: 1.15;
    }
    .tagline {
      font-size: 1.05rem; color: var(--text-muted); line-height: 1.6;
      margin-bottom: 1.75rem; max-width: 420px; margin-left: auto; margin-right: auto;
    }
    .tagline strong { color: var(--text); }

    /* ── Pills ── */
    .pills {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      justify-content: center; margin-bottom: 2rem;
    }
    .pill {
      font-size: 0.75rem; font-weight: 600; padding: 0.3rem 0.8rem;
      border-radius: 999px; border: 1px solid;
    }
    .pill-purple { background: rgba(124,106,247,0.12); color: var(--accent);    border-color: rgba(124,106,247,0.3); }
    .pill-green  { background: rgba(52,211,153,0.1);   color: var(--green);     border-color: rgba(52,211,153,0.3); }
    .pill-amber  { background: rgba(251,191,36,0.1);   color: var(--amber);     border-color: rgba(251,191,36,0.3); }
    .pill-pink   { background: rgba(244,114,182,0.1);  color: var(--pink);      border-color: rgba(244,114,182,0.3); }

    /* ── Links ── */
    .links {
      display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;
      padding-top: 1.5rem; border-top: 1px solid var(--border);
    }
    .link-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.83rem; font-weight: 600; padding: 0.45rem 1rem;
      border-radius: 8px; text-decoration: none; transition: opacity 0.15s;
    }
    .link-btn:hover { opacity: 0.8; }
    .link-btn-primary { background: var(--accent); color: white; }
    .link-btn-ghost   { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }

    /* ── Footer note ── */
    .foot { margin-top: 1.5rem; font-size: 0.72rem; color: var(--text-muted); }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Avatar with floating hobby icons -->
  <div class="avatar-wrap">
    <!-- floating hobby icons -->
    <div class="float-icon">&#128200;</div><!-- chart -->
    <div class="float-icon">&#128218;</div><!-- book -->
    <div class="float-icon">&#128187;</div><!-- laptop -->

    <!-- SVG caricature: big-headed curious person with glasses and headset -->
    <svg class="avatar" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <!-- neck + body -->
      <rect x="65" y="112" width="30" height="18" rx="6" fill="#c8a882"/>
      <path d="M30 155 Q30 130 80 128 Q130 130 130 155 Z" fill="#7c6af7"/>
      <!-- head -->
      <ellipse cx="80" cy="85" rx="42" ry="45" fill="#d4a574"/>
      <!-- ears -->
      <ellipse cx="38" cy="85" rx="8" ry="10" fill="#c8a882"/>
      <ellipse cx="122" cy="85" rx="8" ry="10" fill="#c8a882"/>
      <!-- eyes background (whites) -->
      <ellipse cx="64" cy="82" rx="11" ry="12" fill="white"/>
      <ellipse cx="96" cy="82" rx="11" ry="12" fill="white"/>
      <!-- irises -->
      <circle cx="64" cy="83" r="7" fill="#3b2f6e"/>
      <circle cx="96" cy="83" r="7" fill="#3b2f6e"/>
      <!-- pupils -->
      <circle cx="64" cy="83" r="3.5" fill="#0f0f13"/>
      <circle cx="96" cy="83" r="3.5" fill="#0f0f13"/>
      <!-- eye shine -->
      <circle cx="66" cy="81" r="1.5" fill="white"/>
      <circle cx="98" cy="81" r="1.5" fill="white"/>
      <!-- glasses frames -->
      <rect x="52" y="70" width="24" height="18" rx="5" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <rect x="84" y="70" width="24" height="18" rx="5" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <!-- glasses bridge -->
      <line x1="76" y1="79" x2="84" y2="79" stroke="#fbbf24" stroke-width="2"/>
      <!-- nose -->
      <path d="M78 88 Q80 95 82 88" stroke="#b8855a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- smile -->
      <path d="M66 103 Q80 115 94 103" stroke="#b8855a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- hair: wavy dark brown, visible against dark bg -->
      <path d="M38 78 Q36 55 42 44 Q52 30 80 30 Q108 30 118 44 Q124 55 122 78 Q116 52 108 46 Q98 58 88 48 Q80 56 72 48 Q62 58 52 46 Q42 52 38 78 Z" fill="#4a2c0a"/>
      <!-- hair wave highlights -->
      <path d="M52 46 Q62 56 72 48" stroke="#6b3d12" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M88 48 Q98 56 108 46" stroke="#6b3d12" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- eyebrows (curious / raised) -->
      <path d="M54 68 Q64 63 74 67" stroke="#4a2c0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M86 67 Q96 63 106 68" stroke="#4a2c0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <p class="greeting">Hello there</p>
  <h1>Prakash Thummisetti</h1>
  <p class="tagline">
    A <strong>curious soul</strong> who builds data pipelines by day,
    learns something new every night, and is probably Googling something
    right now.
  </p>

  <div class="pills">
    <span class="pill pill-purple">Data Engineer</span>
<span class="pill pill-amber">Builder of Things</span>
    <span class="pill pill-pink">Chronic Learner</span>
  </div>

  <div class="links">
    <a class="link-btn link-btn-primary" href="https://thummisetti.github.io/reading-list/">
      &#128218; Reading List
    </a>
    <a class="link-btn link-btn-ghost" href="https://github.com/thummisetti" target="_blank" rel="noopener">
      &#128279; GitHub
    </a>
  </div>
</div>

<p class="foot">More here soon &mdash; this page is a work in progress.</p>

</body>
</html>
